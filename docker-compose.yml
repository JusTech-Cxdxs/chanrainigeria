# Runs the website and its PostgreSQL database on any server with Docker.
# 1. cp .env.example .env   and fill it in
# 2. docker compose up -d --build
# 3. docker compose run --rm setup     (first time only: loads the product catalogue)
# 4. open http://SERVER:3000/admin/setup to create the first administrator
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chanrai
      POSTGRES_USER: chanrai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chanrai -d chanrai"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: { context: ., target: runner }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chanrai:${POSTGRES_PASSWORD}@db:5432/chanrai
      DIRECT_URL: postgresql://chanrai:${POSTGRES_PASSWORD}@db:5432/chanrai
    ports:
      - "${WEB_PORT:-3000}:3000"

  setup:
    build: { context: ., target: setup }
    profiles: ["setup"]
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chanrai:${POSTGRES_PASSWORD}@db:5432/chanrai
      DIRECT_URL: postgresql://chanrai:${POSTGRES_PASSWORD}@db:5432/chanrai

volumes:
  db-data:
