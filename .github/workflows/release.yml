# Builds the customer image when a version tag is pushed (git tag v1.0.0 && git push --tags)
# and publishes it as a private package on GitHub Container Registry.
# Customers can then pull it with a read-only token instead of receiving a file.
name: Release image
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Image names must be lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ env.OWNER }}/chanrai-web:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER }}/chanrai-web:latest
