# Chanrai Nigeria website: installation on the company's server.
# You need Docker with the Compose plugin. Full steps: INSTALL.md in this folder.
#
#   docker load -i chanrai-web-<version>.tar.gz
#   cp .env.example .env      and fill it in
#   docker compose up -d
#   open https://YOUR-DOMAIN/admin
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chanrai
      POSTGRES_USER: chanrai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chanrai -d chanrai"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ${WEB_IMAGE:-chanrai-web:latest}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chanrai:${POSTGRES_PASSWORD}@db:5432/chanrai
      DIRECT_URL: postgresql://chanrai:${POSTGRES_PASSWORD}@db:5432/chanrai
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  # Daily overdue-enquiry reminder at 08:00 Lagos time (07:00 UTC).
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on: [web]
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    command:
      - sh
      - -c
      - |
        echo "0 7 * * * wget -qO- --header='Authorization: Bearer $${CRON_SECRET}' http://web:3000/api/cron/overdue >/dev/null 2>&1" | crontab -
        exec crond -f -l 8

  # Nightly database backup kept for 14 days in ./backups (includes all uploaded pictures).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        echo "30 1 * * * PGPASSWORD='$${PGPASSWORD}' pg_dump -h db -U chanrai -Fc chanrai > /backups/chanrai-\$$(date +\\%F).dump && find /backups -name '*.dump' -mtime +14 -delete" | crontab -
        exec crond -f -l 8

volumes:
  db-data:
